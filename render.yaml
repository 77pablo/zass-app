# Blueprint de Render para la API de ZASS!. Ver DESPLIEGUE-API.md.
# Solo la API: el sitio va en Cloudflare Pages y la base en Neon.
#
# Las variables con `sync: false` NO llevan valor aquí: Render las pide en el panel al crear
# el servicio. Ningún secreto vive en este archivo.
services:
  - type: web
    name: zass-api
    runtime: docker
    plan: free              # verifica el plan gratuito vigente en la página de Render
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/salud/lista
    autoDeploy: false       # desplegar a mano: primero se migra la base, después se despliega
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # --- Secretos: se escriben en el panel de Render, nunca aquí ---
      - key: Zass__CadenaConexion
        sync: false         # formato Npgsql de Neon, con SSL Mode=Require
      - key: Zass__ClaveDireccionesBase64
        sync: false         # 32 bytes en Base64; GUÁRDALA fuera de Render también
      # Firma del aviso de pago (#133, P16). OBLIGATORIA desde el 19-nov-2026: sin ella, o con
      # menos de 32 caracteres, la API NO ARRANCA en produccion. Valor aleatorio, 32+ caracteres.
      - key: Zass__SecretoAvisoPagos
        sync: false
      # --- Configuración no secreta pero que depende de tu cuenta ---
      - key: Zass__ProxiesDeConfianza
        sync: false         # rangos de Cloudflare + red del balanceador de Render (ver guía)
      # CINCO, medido el 15-nov-2026 leyendo la tabla de auditoria de produccion, no
      # deducido. Con 3 la IP que se guardaba era la de Cloudflare: todas las filas del 8 al
      # 11-nov traen rangos 172.64.0.0/13 y 172.70.x. El 12-nov, con este valor en 5, las
      # filas pasan a traer direcciones que NO son de Cloudflare (una chilena, 200.91.9.226).
      #
      # La cadena tiene mas saltos de los que parece porque hay DOS Cloudflare distintos: el
      # nuestro (Pages) y el que Render tiene delante de su propio origen. Si este archivo
      # dice 3 y alguien recrea el servicio desde el, el defecto vuelve — y es de los que no
      # se notan: el sitio funciona igual, solo que el limite de peticiones se cuenta por
      # salida de Cloudflare y las sesiones guardan una IP que no es de nadie.
      - key: Zass__SaltosDeProxy
        value: "5"
      - key: Zass__ExigirHttps
        value: "true"
