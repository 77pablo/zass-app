<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <title>Imagen para compartir de ZASS!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet" />
    <style>
      /* Mismos colores que los tokens de src/index.css: --fondo, --amarillo, --texto, --suave. */
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; background: #07070a; }
      body {
        font-family: Montserrat, system-ui, 'Segoe UI', sans-serif;
        color: #f5f2e8;
        position: relative;
        overflow: hidden;
      }
      /* Un resplandor amarillo suave arriba a la derecha, como el de la portada. */
      .brillo {
        position: absolute; right: -180px; top: -220px; width: 760px; height: 760px; border-radius: 50%;
        background: radial-gradient(circle, rgba(246, 200, 30, 0.38) 0%, rgba(246, 200, 30, 0) 68%);
      }
      .linea { position: absolute; left: 80px; right: 80px; bottom: 76px; height: 2px; background: rgba(255, 255, 255, 0.11); }
      .logo {
        position: absolute; left: 80px; top: 70px;
        font-size: 84px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
      }
      .logo em { font-style: normal; color: #f6c81e; }
      h1 {
        position: absolute; left: 80px; top: 236px; width: 900px;
        font-size: 112px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
      }
      h1 span { color: #f6c81e; }
      p {
        position: absolute; left: 80px; bottom: 100px;
        font-size: 34px; font-weight: 500; color: #aaa697; letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="brillo"></div>
    <div class="logo">ZAS<em>S!</em></div>
    <h1>Busca a alguien <span>de tu ciudad.</span></h1>
    <p>Buscar es gratis. Habla directo con quien te atiende.</p>
    <div class="linea"></div>
  </body>
</html>
