<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ZASS! se usa en la calle, desde el celular, despues de tocar una tarjeta NFC: «Agregar a la
      pantalla de inicio» tiene que dar el nombre y el icono de la marca. El manifiesto va aqui,
      FUERA de las marcas seo, porque la Function de /prestadores/:slug reemplaza lo de adentro.
      iOS no lee el manifiesto: por eso ademas el apple-touch-icon.
      No hay service worker ni cache offline a proposito (ver el PR).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ZASS!" />
    <meta name="theme-color" content="#1A1A1A" />
    <!--
      Lo que va entre las marcas seo:inicio y seo:fin es lo que la Function de /prestadores/:slug reemplaza
      por las etiquetas de cada ficha. NO quites las marcas: sin ellas las fichas salen sin meta (hay una
      prueba que lo vigila). Fuera de las marcas, nada se toca.
    -->
    <!--seo:inicio-->
    <title>ZASS! · Conecta con un toque</title>
    <meta name="description" content="Busca a alguien de tu ciudad: abogados, contadores, corredores, arquitectos y técnicos, cerca de ti. Buscar en ZASS! es gratis." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZASS!" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="ZASS! · Conecta con un toque" />
    <meta property="og:description" content="Busca a alguien de tu ciudad: abogados, contadores, corredores, arquitectos y técnicos, cerca de ti. Buscar en ZASS! es gratis." />
    <meta property="og:image" content="https://zass.cl/og-zass.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZASS! · Conecta con un toque" />
    <meta name="twitter:description" content="Busca a alguien de tu ciudad: abogados, contadores, corredores, arquitectos y técnicos, cerca de ti. Buscar en ZASS! es gratis." />
    <meta name="twitter:image" content="https://zass.cl/og-zass.png" />
    <!--seo:fin-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
