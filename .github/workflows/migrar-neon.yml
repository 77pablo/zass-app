name: Migrar la base de produccion

# Aplica las migraciones de EF Core a Neon, a mano y solo a mano.
#
# Por que existe: en el PC de Pablo no se puede. El entorno local tiene Postgres 16.4 y, sobre
# todo, Smart App Control de Windows bloquea los ensamblados recien compilados, asi que
# `dotnet ef` falla con «Could not load assembly 'Zass.Infraestructura'» de forma
# intermitente. Aqui corre en una maquina limpia, queda registrado quien lo lanzo y cuando, y
# el registro se puede leer despues. Es el mismo motivo por el que el flujo de copias vive
# aqui y no en el PC.
#
# Lo que NO hace: dispararse solo. No tiene `schedule` ni `push` a proposito. Una migracion de
# produccion es una decision, no un efecto secundario de un merge.
#
# Antes de aplicar nada **vuelca y cifra la base**. Una migracion aditiva es poco probable que
# rompa algo, pero «poco probable» no es una estrategia de recuperacion, y hoy restaurar desde
# el PC de Pablo NO se puede (su `pg_restore` es 16.4 y el volcado es 18).

on:
  workflow_dispatch:
    inputs:
      confirmo:
        description: 'Escribe MIGRAR en mayusculas para confirmar'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar la confirmacion
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmo }}" != "MIGRAR" ]; then
            echo "DETENIDO: hay que escribir MIGRAR para confirmar. Se escribio: '${{ inputs.confirmo }}'" >&2
            exit 1
          fi
          echo "Confirmado por ${{ github.actor }}."

      - uses: actions/checkout@v4

      # Sin `cache: true`: ese cache exige un packages.lock.json y este repositorio no tiene
      # ninguno, asi que pedirlo haria fallar el flujo entero por una optimizacion. Esta tarea
      # se corre un puñado de veces, no en cada commit: no vale la pena.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------------------------------------------------------- la copia, primero
      - name: Volcar y cifrar la base ANTES de tocarla
        env:
          NEON_URL_COPIAS: ${{ secrets.NEON_URL_COPIAS }}
          FRASE_COPIAS: ${{ secrets.FRASE_COPIAS }}
        run: |
          set -euo pipefail
          test -n "$NEON_URL_COPIAS" || { echo "Falta el secreto NEON_URL_COPIAS" >&2; exit 1; }
          test -n "$FRASE_COPIAS" || { echo "Falta el secreto FRASE_COPIAS" >&2; exit 1; }
          # Cliente 18 como el servidor, igual que en el flujo de copias.
          docker run --rm -e NEON_URL_COPIAS postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$NEON_URL_COPIAS"' \
            > antes.dump
          test -s antes.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$FRASE_COPIAS" \
              --symmetric --cipher-algo AES256 \
              -o "antes-de-migrar-$(date -u +%Y%m%dT%H%M%SZ).dump.gpg" antes.dump
          rm antes.dump
          ls -lh *.dump.gpg

      - name: Guardar la copia fuera del servidor de la base
        uses: actions/upload-artifact@v4
        with:
          name: copia-antes-de-migrar
          path: '*.dump.gpg'
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------- la cadena de conexion
      # El secreto esta en formato URL (postgres://...) porque es lo que quiere `pg_dump`.
      # Npgsql NO lee ese formato, asi que se traduce aqui. No se imprime nunca: se escribe
      # directo en el entorno del paso siguiente con `::add-mask::` por delante.
      - name: Traducir la URL de Neon al formato de Npgsql
        env:
          NEON_URL_COPIAS: ${{ secrets.NEON_URL_COPIAS }}
        run: |
          set -euo pipefail
          cadena=$(python3 - <<'PY'
          import os, urllib.parse as u
          p = u.urlparse(os.environ["NEON_URL_COPIAS"])
          base = p.path.lstrip("/").split("?")[0]
          partes = [
              f"Host={p.hostname}",
              f"Port={p.port or 5432}",
              f"Database={base}",
              f"Username={u.unquote(p.username or '')}",
              f"Password={u.unquote(p.password or '')}",
              "SSL Mode=Require",
              "Trust Server Certificate=true",
          ]
          print(";".join(partes))
          PY
          )
          test -n "$cadena"
          echo "::add-mask::$cadena"
          echo "ZASS_CADENA_CONEXION=$cadena" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- antes y despues
      - name: Que migraciones tiene la base AHORA
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet ef migrations list \
            --project src/Zass.Infraestructura --startup-project src/Zass.Infraestructura \
            | tee antes.txt

      - name: Aplicar las migraciones
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet ef database update \
            --project src/Zass.Infraestructura --startup-project src/Zass.Infraestructura

      - name: Que migraciones tiene la base DESPUES
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet ef migrations list \
            --project src/Zass.Infraestructura --startup-project src/Zass.Infraestructura \
            | tee despues.txt
          echo "--- lo que cambio ---"
          diff antes.txt despues.txt || true
          # `migrations list` marca «(Pending)» lo que la base no tiene. Despues de aplicar no
          # puede quedar ninguna: si queda, el update no hizo lo que dijo.
          if grep -q '(Pending)' despues.txt; then
            echo "FALLO: quedan migraciones pendientes despues de aplicar:" >&2
            grep '(Pending)' despues.txt >&2
            exit 1
          fi

      # ---------------------------------------------------------------- comprobar en el catalogo
      # Un «Done» de EF no dice que el objeto quedara como se escribio. Se le pregunta a
      # PostgreSQL, que es la leccion mas repetida de este proyecto.
      #
      # La lista de lo esperado NO se escribe aqui a mano: la anterior estaba fija a los objetos
      # del 15-nov, no miro el indice del 17-nov y, ademas, imprimia los numeros sin fallar
      # nunca. Ahora sale del ModelSnapshot que EF reescribe en cada migracion: toda tabla,
      # indice y clave del modelo (R-1, `ux_cita_bloque_activo`, incluido) se busca en el
      # catalogo, y si falta uno el flujo FALLA.
      - name: Comprobar en el catalogo, no en el «Done»
        env:
          NEON_URL_COPIAS: ${{ secrets.NEON_URL_COPIAS }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/esquema-esperado.py \
            backend/src/Zass.Infraestructura/Datos/Migraciones/ZassDbContextModelSnapshot.cs \
            > faltantes.sql
          faltan=$(docker run --rm -e NEON_URL_COPIAS -v "$PWD/faltantes.sql:/faltantes.sql:ro" postgres:18 \
            sh -c 'psql -X -At -v ON_ERROR_STOP=1 "$NEON_URL_COPIAS" -f /faltantes.sql')
          if [ -n "$faltan" ]; then
            echo "FALLO: el modelo espera esto y la base no lo tiene:" >&2
            echo "$faltan" >&2
            exit 1
          fi
          echo "La base tiene todas las tablas, indices y claves del modelo."
