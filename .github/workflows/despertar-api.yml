# Despierta la API antes de que llegue la gente.
# NO arregla la causa: la causa es el plan gratis de Render, que duerme el servicio tras
# ~15 min sin trafico. Esto solo tapa el sintoma: el primer visitante del dia no espera ~26 s.
# GitHub solo lanza `schedule` y `workflow_dispatch` desde la rama por defecto (main).
name: Despertar API

on:
  schedule:
    - cron: "*/15 * 22-24 11 *"   # SOLO ventana de lanzamiento: 22 nov 00:00 a 24 nov 23:59 UTC (21 nov 21:00 a 24 nov 20:59, hora de Chile)
  workflow_dispatch: {}      # a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir /api/salud y anotar cuanto tardo
        env:
          # La URL directa de Render NO va escrita aqui (el repositorio es publico, P-11): es la
          # variable de repositorio URL_API (Settings > Secrets and variables > Actions >
          # Variables), por ejemplo «https://<servicio>.onrender.com/api/salud». /api/salud esta
          # exenta del secreto de origen, asi que sigue respondiendo 200 aunque la API lo exija.
          # Sin la variable se pide por zass.cl, que solo sirve con el sitio ABIERTO: en
          # mantenimiento la Function responde 503 a todo, tambien a esto.
          URL_API: ${{ vars.URL_API }}
        run: |
          URL="${URL_API:-https://zass.cl/api/salud}"
          salida=$(curl -s -o /dev/null --max-time 60 -w '%{http_code} %{time_total}' "$URL" || true)
          codigo=${salida%% *}
          tiempo=${salida##* }
          echo "$(date -u +%H:%M:%S) UTC | HTTP ${codigo:-sin respuesta} | ${tiempo:-?} s | $URL"
          test "$codigo" = "200" || { echo "No respondio 200 (respondio '${codigo}')" >&2; exit 1; }