name: Escaneo de secretos

on:
  push:
    branches: [main]
  pull_request:

# Una corrida viva por rama: un push nuevo cancela la corrida anterior de esa rama.
# En main no se cancela, para no interrumpir la validacion de una fusion.
concurrency:
  group: secretos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          mv gitleaks /usr/local/bin/

      - name: Escanear secretos
        run: |
          gitleaks git --verbose
        continue-on-error: false
