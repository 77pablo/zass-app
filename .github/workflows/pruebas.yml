name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: zass
          POSTGRES_PASSWORD: zass_ci_clave_local
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zass -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar
        run: dotnet build backend/Zass.sln -c Debug

      - name: Pruebas de aplicacion
        run: dotnet test backend/pruebas/Zass.Aplicacion.Pruebas --no-build

      - name: Pruebas de arquitectura
        run: dotnet test backend/pruebas/Zass.Arquitectura.Pruebas --no-build

      - name: Pruebas de integracion
        env:
          ZASS_CADENA_PRUEBAS: Host=127.0.0.1;Port=5432;Database=zass_pruebas;Username=zass;Password=zass_ci_clave_local
        run: |
          # RAMA DE DIAGNOSTICO, NO FUSIONAR.
          # Los registros de Actions solo los descarga quien tenga permisos de administracion
          # del repositorio; las anotaciones, en cambio, se leen por la API publica. Esto
          # vuelca los nombres de las pruebas rojas a anotaciones para poder verlas sin esos
          # permisos. Se borra en cuanto se sepa por que esta rojo main.
          set -o pipefail
          dotnet test backend/pruebas/Zass.Integracion.Pruebas --no-build > salida.txt 2>&1 || true
          anotar() {
            while IFS= read -r linea; do
              limpia=$(printf '%s' "$linea" | sed 's/^[[:space:]]*//')
              if [ -n "$limpia" ]; then echo "::error title=$1::$limpia"; fi
            done
          }
          grep -aE 'Superado!|Con error!|Passed!|Failed!' salida.txt | tail -2 | anotar Resumen
          grep -aE '^[[:space:]]*(Failed|Con error)[[:space:]]+[A-Za-z]' salida.txt | head -5 | anotar PruebaRoja
          grep -aE 'Error Message|Mensaje de error' -A 2 salida.txt | head -6 | anotar Detalle
          if grep -aqE 'Con error!|Failed!' salida.txt; then exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Pruebas de interfaz
        run: npx vitest run

      - name: Lint
        run: npx oxlint
