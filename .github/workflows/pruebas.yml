name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres NO va en `services:` sino levantado a mano, por una razon concreta: `services`
    # no deja pasarle argumentos al servidor, y este necesita uno. Las pruebas de cupos de
    # fundador abren 61 conexiones FISICAS a la vez (60 solicitantes mas la de la prueba) para
    # que la carrera por los 50 cupos sea de verdad. Con el techo de fabrica (100, y menos las
    # que ya tienen abiertas las otras pruebas) quedaban 30 libres: la prueba fallaba al ABRIR,
    # sin llegar a medir nada, y el rojo parecia un defecto del reparto de cupos.
    #
    # Fue lo que tuvo `main` en rojo del 12 al 13 de noviembre de 2026.

    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL con PostGIS y techo de conexiones alto
        run: |
          docker run -d --name zass-postgres             -e POSTGRES_USER=zass             -e POSTGRES_PASSWORD=zass_ci_clave_local             -e POSTGRES_DB=postgres             -p 5432:5432             postgis/postgis:17-3.5             -c max_connections=300
          for intento in $(seq 1 30); do
            if docker exec zass-postgres pg_isready -U zass -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec zass-postgres pg_isready -U zass -d postgres

      - name: Comprobar el techo de conexiones
        # Se MIRA el valor que quedo puesto, no se supone porque el `docker run` no dio error:
        # un argumento mal escrito no impide arrancar y dejaria el techo de fabrica. Y si algun
        # dia el paso de arriba se rompe en silencio, este falla aqui y no 20 minutos despues
        # dentro de una prueba de concurrencia.
        run: |
          techo=$(docker exec zass-postgres psql -U zass -d postgres -tAc "SHOW max_connections")
          echo "max_connections = $techo"
          test "$techo" -ge 200

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar
        run: dotnet build backend/Zass.sln -c Debug

      - name: Pruebas de aplicacion
        run: dotnet test backend/pruebas/Zass.Aplicacion.Pruebas --no-build

      - name: Pruebas de arquitectura
        run: dotnet test backend/pruebas/Zass.Arquitectura.Pruebas --no-build

      - name: Pruebas de integracion
        env:
          ZASS_CADENA_PRUEBAS: Host=127.0.0.1;Port=5432;Database=zass_pruebas;Username=zass;Password=zass_ci_clave_local
        run: dotnet test backend/pruebas/Zass.Integracion.Pruebas --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Pruebas de interfaz
        run: npx vitest run

      - name: Lint
        run: npx oxlint