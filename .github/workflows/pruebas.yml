name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres NO va en `services:` sino levantado a mano, por una razon concreta: `services`
    # no deja pasarle argumentos al servidor, y este necesita uno. Las pruebas de cupos de
    # fundador abren 61 conexiones FISICAS a la vez (60 solicitantes mas la de la prueba) para
    # que la carrera por los 50 cupos sea de verdad. Con el techo de fabrica (100, y menos las
    # que ya tienen abiertas las otras pruebas) quedaban 30 libres: la prueba fallaba al ABRIR,
    # sin llegar a medir nada, y el rojo parecia un defecto del reparto de cupos.
    #
    # Fue lo que tuvo `main` en rojo del 12 al 13 de noviembre de 2026.

    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL con PostGIS y techo de conexiones alto
        run: |
          docker run -d --name zass-postgres             -e POSTGRES_USER=zass             -e POSTGRES_PASSWORD=zass_ci_clave_local             -e POSTGRES_DB=postgres             -p 5432:5432             postgis/postgis:17-3.5             -c max_connections=300

          # Espera ACTIVA al servidor DEFINITIVO, sondeando POR TCP. No basta con que
          # `docker run` no diera error: eso solo dice que el contenedor arrancó.
          #
          # Por qué por TCP y no por el socket: la imagen de Postgres arranca DOS veces. La
          # primera es la de inicialización (initdb), que levanta un servidor temporal
          # escuchando SOLO en el socket local (`listen_addresses` vacío) y después lo apaga.
          # Un `pg_isready` contra el socket contesta «listo» en esa ventana, el paso
          # siguiente se encuentra con «the database system is shutting down» o con
          # «rejecting connections», y el rojo parece un defecto de la aplicación. Pasó tres
          # veces el 13 y el 14 de noviembre de 2026 (carreras 43507284232, 43534953922 y
          # 43543057135). Por TCP ese servidor temporal no contesta NUNCA, así que del bucle
          # solo se sale con el servidor de verdad.
          espera_max=120
          esperado=0
          listo=no
          while [ "$esperado" -lt "$espera_max" ]; do
            if docker exec zass-postgres pg_isready -h 127.0.0.1 -p 5432 -U zass -d postgres >/dev/null 2>&1; then
              listo=si
              break
            fi
            sleep 2
            esperado=$((esperado + 2))
          done
          if [ "$listo" != "si" ]; then
            echo "DETENIDO: Postgres no aceptó conexiones TCP en ${espera_max} s."
            docker logs zass-postgres 2>&1 | tail -60
            exit 1
          fi
          echo "El servidor acepta TCP dentro del contenedor (tras ${esperado} s)."

          # Y ahora desde el HOST, que es por donde conectan las pruebas
          # (Host=127.0.0.1;Port=5432): el puerto publicado puede tardar un instante más
          # que el servidor, y es esa dirección la que hay que dar por buena, no otra.
          desde_host=no
          for intento in $(seq 1 15); do
            if docker run --rm --network host postgis/postgis:17-3.5                  pg_isready -h 127.0.0.1 -p 5432 -U zass -d postgres >/dev/null 2>&1; then
              desde_host=si
              break
            fi
            sleep 2
          done
          if [ "$desde_host" != "si" ]; then
            echo "DETENIDO: el servidor está arriba pero 127.0.0.1:5432 no responde desde el host."
            docker logs zass-postgres 2>&1 | tail -60
            exit 1
          fi
          echo "127.0.0.1:5432 responde desde el host (al intento $intento)."

      - name: Comprobar el techo de conexiones
        # Se MIRA el valor que quedó puesto, no se supone porque el `docker run` no dio error:
        # un argumento mal escrito no impide arrancar y dejaría el techo de fábrica. Y si algún
        # día el paso de arriba se rompe en silencio, este falla aquí y no 20 minutos después
        # dentro de una prueba de concurrencia.
        #
        # Sin reintentos a propósito: la espera del paso anterior ya garantiza el servidor
        # definitivo por TCP. Si esto falla, es una señal de verdad y hay que mirarla, no un
        # parpadeo que convenga tapar con un bucle. Va por TCP (-h 127.0.0.1) y no por el
        # socket, por la misma razón que la espera, y de paso comprueba que la autenticación
        # por contraseña funciona por esa vía.
        run: |
          techo=$(docker exec -e PGPASSWORD=zass_ci_clave_local zass-postgres                     psql -h 127.0.0.1 -p 5432 -U zass -d postgres -tAc "SHOW max_connections")
          echo "max_connections = $techo"
          test "$techo" -ge 200

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar
        run: dotnet build backend/Zass.sln -c Debug

      - name: Pruebas de aplicacion
        run: dotnet test backend/pruebas/Zass.Aplicacion.Pruebas --no-build

      - name: Pruebas de arquitectura
        run: dotnet test backend/pruebas/Zass.Arquitectura.Pruebas --no-build

      - name: Pruebas de integracion
        env:
          ZASS_CADENA_PRUEBAS: Host=127.0.0.1;Port=5432;Database=zass_pruebas;Username=zass;Password=zass_ci_clave_local
        run: dotnet test backend/pruebas/Zass.Integracion.Pruebas --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Pruebas de interfaz
        run: npx vitest run

      - name: Lint
        run: npx oxlint